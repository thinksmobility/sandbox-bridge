# `envsubst` şablonu — nginx:alpine resmi imajı bu dosyayı
# `/etc/nginx/templates/default.conf.template`'e kopyalayınca konteyner
# başlarken otomatik render eder. `${SANDBOX_ALLOWED_ORIGINS}` boşlukla
# ayrılmış CP origin listesidir (ör. "https://hello.tmobstudio.ai
# https://factory.tmobstudio.ai").
#
# ⚠️ `envsubst` bash'in `${VAR:-default}` sözdizimini DESTEKLEMEZ — burada
# bir fallback YAZILAMAZ. Güvenli (fail-closed) varsayılan iki katmanda
# garanti edilir: (1) Dockerfile'daki `ENV SANDBOX_ALLOWED_ORIGINS="'none'"`
# build-time varsayılanı, (2) `05-normalize-sandbox-env.envsh` (bu template
# envsubst edilmeden ÖNCE koşar) operatör `docker run -e
# SANDBOX_ALLOWED_ORIGINS=""` ile env'i BOŞ geçse bile `'none'`'a normalize
# eder — aksi halde `frame-ancestors ;` gibi kaynaksız/geçersiz bir
# direktif üretilirdi.
#
# ⚠️ nginx MİRAS KURALI: bir location kendi `add_header`'ını tanımlarsa
# server seviyesindeki `add_header`'ların TAMAMI o location'da DÜŞER (nginx
# resmi davranışı — "inherited only if the current level doesn't have its
# own add_header"). Bu yüzden 3 güvenlik başlığı server bloğunun YANI SIRA
# kendi `add_header`'ı olan HER location'da da tekrarlanır (gerçek olay:
# js/css/font/manifest yanıtları başlıksız çıkıyordu).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Yalnızca listelenen origin'lerin bu demoyu iframe'e alması izinlidir.
  # X-Frame-Options KASITLI OLARAK gönderilmez — allow-list ifade edemez ve
  # gönderilirse tarayıcılar frame-ancestors'ı yok sayabilir.
  add_header Content-Security-Policy "frame-ancestors ${SANDBOX_ALLOWED_ORIGINS}" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;
  gzip_min_length 1024;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # sandbox.manifest.json ve thumbnail'lar önbelleklenmez — build her
  # deploy'da değişebilir.
  location = /sandbox.manifest.json {
    add_header Content-Security-Policy "frame-ancestors ${SANDBOX_ALLOWED_ORIGINS}" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  # Konteyner başlarken `40-generate-sandbox-runtime.sh` tarafından üretilir
  # (`window.__SANDBOX_RUNTIME__`) — asla önbelleklenmez, aksi halde eski bir
  # deploy'un origin listesi tarayıcıda takılı kalabilir. `location =` tam
  # eşleşme, aşağıdaki genel `*.js` önbellek kuralından ÖNCELİKLİDİR (nginx'in
  # kendi eşleştirme sırası — dosya sırası önemsizdir).
  location = /sandbox-runtime.js {
    add_header Content-Security-Policy "frame-ancestors ${SANDBOX_ALLOWED_ORIGINS}" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location ~* \.(?:js|css|woff2?|png|jpg|jpeg|webp|svg)$ {
    add_header Content-Security-Policy "frame-ancestors ${SANDBOX_ALLOWED_ORIGINS}" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
}
